<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña - Supermercado PRO</title>
    <style>
        :root { --primary: #3b82f6; --primary-dark: #1d4ed8; --dark: #1e293b; --light: #f8fafc; --success: #16a34a; --danger: #dc2626; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--light); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--dark); }
        
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); width: 400px; border-top: 5px solid var(--primary); }
        h2 { margin-top: 0; font-size: 22px; font-weight: 800; color: var(--dark); text-align: center; }
        .subtitle { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 18px; }
        label { font-size: 12px; font-weight: 700; color: #475569; display: block; margin-bottom: 6px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; background: #f8fafc; }
        input:focus { border-color: var(--primary); background: white; }
        
        .btn-submit { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 15px; transition: background 0.2s; }
        .btn-submit:hover { background: var(--primary-dark); }
        
        .back-link { display: block; text-align: center; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 13px; font-weight: 600; }
        .back-link:hover { color: var(--dark); }

        .msg-success { background: #dcfce7; color: #15803d; padding: 12px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 20px; font-weight: 600; }
        .msg-error { background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 20px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 Cambiar Mi Contraseña</h2>
        <div class="subtitle">Actualiza las credenciales de tu cuenta activa</div>

        {% if mensaje %}
            <div class="msg-success">{{ mensaje }}</div>
        {% endif %}
        {% if error %}
            <div class="msg-error">{{ error }}</div>
        {% endif %}

        <form action="/cambiar-password" method="POST">
            <div class="form-group">
                <label>Contraseña Actual:</label>
                <input type="password" name="password_actual" required placeholder="••••••••">
            </div>
            
            <div class="form-group">
                <label>Nueva Contraseña:</label>
                <input type="password" name="password_nueva" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-submit">Actualizar Contraseña</button>
        </form>

        <a href="/menu" class="back-link">← Volver al Panel Principal</a>
    </div>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (event.keyCode == 123 || (event.ctrlKey && event.shiftKey && (event.keyCode == 73 || event.keyCode == 74)) || (event.ctrlKey && event.keyCode == 85)) {
                event.preventDefault();
                alert("¡Acción bloqueada por políticas de seguridad del proyecto!");
                return false;
            }
        });
    </script>
</body>
</html>
